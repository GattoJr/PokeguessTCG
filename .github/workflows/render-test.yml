name: Render test
on:
  push:
    branches: [upscale-test]
    paths: ['scripts/render_art.py', 'scripts/render_test.py', '.github/workflows/render-test.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install spandrel pillow numpy boto3
      - run: |
          mkdir -p models
          curl -sSfL -o models/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          git clone --depth 1 https://github.com/PokemonTCG/pokemon-tcg-data ptcg-data
      - run: python scripts/render_test.py 2>&1 | tee log.txt; test ${PIPESTATUS[0]} -eq 0 || { echo "::error::$(tail -4 log.txt | tr '\n' ' ')"; exit 1; }
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - if: always()
        run: |
          cp log.txt out/render/log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -qm "Render test results" && git pull -q --rebase && git push || true
