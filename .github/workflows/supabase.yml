# Deploys the database changes (supabase/migrations) and the image function (supabase/functions)
# to Supabase whenever they change on main. Needs three repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_ID    project reference, the xxxx in https://xxxx.supabase.co
#   SUPABASE_DB_PASSWORD   database password chosen when the project was created
# Until the secrets exist the job only prints a notice. Run it by hand from the Actions tab after adding them.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        if: ${{ env.PROJECT_ID == '' || env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == '' }}
        run: echo "::notice::Supabase secrets are not set yet, nothing deployed. See SETUP.md."
      - uses: actions/checkout@v4
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
      - uses: supabase/setup-cli@v1
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        with:
          version: latest
      - name: Link project
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Database
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        # on failure the last lines also go to the run summary (annotations), readable without the full log
        run: |
          # newer CLIs need --remote to push to the linked project; older ones call it --linked
          out=$(supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes 2>&1) && { echo "$out"; exit 0; }
          if echo "$out" | grep -qi "unknown flag"; then
            out=$(supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes 2>&1) && { echo "$out"; exit 0; }
          fi
          echo "$out"
          echo "::error::db push failed: $(echo "$out" | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
          exit 1
      - name: Image function
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: |
          out=$(supabase functions deploy art --project-ref "$PROJECT_ID" --no-verify-jwt --yes 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          echo "::error::functions deploy failed: $(echo "$out" | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
          exit 1
