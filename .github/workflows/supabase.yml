# Deploys the database changes (supabase/migrations) and the image function (supabase/functions)
# to Supabase whenever they change on main. Needs three repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_ID    project reference, the xxxx in https://xxxx.supabase.co
#   SUPABASE_DB_PASSWORD   database password chosen when the project was created
# Until the secrets exist the job only prints a notice. Run it by hand from the Actions tab after adding them.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        if: ${{ env.PROJECT_ID == '' || env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == '' }}
        run: echo "::notice::Supabase secrets are not set yet, nothing deployed. See SETUP.md."
      - uses: actions/checkout@v4
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
      - uses: supabase/setup-cli@v1
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        with:
          version: latest
      - name: Link project
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Database
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Image function
        if: ${{ env.PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase functions deploy art --project-ref "$PROJECT_ID" --no-verify-jwt
